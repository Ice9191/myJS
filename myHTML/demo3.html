<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何理解盒模型</title>
    <style>
        .box1 {
            width: 200px;
            height: 200px;
            padding: 10px;
            margin: 10px;
            border: 10px solid red;
            /* 默认盒模型 */
            box-sizing: content-box;
        }

        .box2 {
            width: 200px;
            height: 200px;
            padding: 10px;
            margin: 10px;
            border: 10px solid red;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div>标准盒模型：实际宽度=width+padding+border+内容，向外扩展</div>
    <div class="box1"></div>
    <div>--------------------------------</div>
    <div>怪异盒模型：实际宽度=width(包含padding+border+内容)，向内扩展</div>
    <div class="box2"></div>
</body>

</html>
