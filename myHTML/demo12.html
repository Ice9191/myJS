<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组常用的方法</title>
</head>

<body>
    <script>
        let arr1 = [1, 2, 3, 4, 5]
        // push()  向数组末尾添加一个或多个元素，并返回新的长度
        console.log(arr1.push(6))    //6
        console.log(arr1)    //[1, 2, 3, 4, 5, 6]
        console.log('-----------------------------------')
        let arr2 = ['a', 'b', 'c', 'd', 'e']
        // pop()  删除数组最后一个元素，并返回该元素
        console.log(arr1.pop())
    </script>
</body>

</html>
